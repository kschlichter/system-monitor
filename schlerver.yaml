#####################
    - name: Schlerver Boot Time
      value_template: "{{ value_json.boot_time }}"

    - name: Schlerver Sync Time
      value_template: "{{ (as_timestamp(value_json.timestamp)|int) | timestamp_custom('%Y-%m-%d %H:%M:%S') }}"
