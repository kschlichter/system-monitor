#####################
# RAID
#####################
    - name: Schlerver RAID Active
      value_template: "{{ value_json.drives.mdstat.devices.md127.active }}"

    - name: Schlerver RAID Personality
      value_template: "{{ value_json.drives.mdstat.devices.md127.personality }}"

    - name: Schlerver RAID Disk Count
      value_template: "{{ float(value_json.drives.mdstat.devices.md127.status.raid_disks,default=0) }}"

    - name: Schlerver RAID Non-Degraded Disks
      value_template: "{{ float(value_json.drives.mdstat.devices.md127.status.non_degraded_disks,default=0) }}"

    - name: Schlerver RAID Resync
      value_template: "{{ value_json.drives.mdstat.devices.md127.resync }}"

    - name: Schlerver RAID Resync Progress
      value_template: > 
        {% if states('sensor.schlerver_raid_resync') != 'None' %}
          {{ float(value_json.drives.mdstat.devices.md127.resync.progress[:-1]|round(0),default=0) }}
        {% else %}
          {{ min(((states('input_number.schlerver_raid_resync_progress')|round(0)|int)+2),100) }}
        {% endif %}

    - name: Schlerver RAID Resync Time
      value_template: >
        {% if states('sensor.schlerver_raid_resync') != 'None' %}
          {{ value_json.drives.mdstat.devices.md127.resync.finish.split('min')[0] }}
        {% else %}
          {{ states('input_text.schlerver_raid_resync_time') }}
        {% endif %}

