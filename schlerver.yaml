    - name: Schlerver RAID Resync
      unique_id: 2026-06-30 07:39:07.599494-07:00
      value_template: "{{ value_json.drives.mdstat.devices.md127.resync }}"

    - name: Schlerver RAID Resync Progress
      unique_id: 2026-06-30 07:39:13.273114-07:00
      value_template: > 
        {% if states('sensor.schlerver_raid_resync') != 'None' %}
          {{ float(value_json.drives.mdstat.devices.md127.resync.progress[:-1]|round(0),default=0) }}
        {% else %}
          {{ min(((states('input_number.schlerver_raid_resync_progress')|round(0)|int)+2),100) }}
        {% endif %}
      state_class: measurement
      unit_of_measurement: '%'

    - name: Schlerver RAID Resync Time
      unique_id: 2026-06-30 07:39:28.117512-07:00
      value_template: >
        {% if states('sensor.schlerver_raid_resync') != 'None' %}
          {{ value_json.drives.mdstat.devices.md127.resync.finish.split('min')[0] }}
        {% else %}
          {{ states('input_text.schlerver_raid_resync_time') }}
        {% endif %}
      device_class: duration
      unit_of_measurement: 'min'

