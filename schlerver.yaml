#####################
# Schlerver
#####################
- resource: "http://10.2.0.10:8123/local/hass_monitor/schlerver/hass_monitor_schlerver.json"
  sensor:


#####################
# CPU Stuffs
#####################
    - name: Schlerver CPU Temp
      value_template: "{{ float(value_json.cpus.temp,default=0) }}"
      #device_class: temperature ### Converts to F!
      unit_of_measurement: °C
      icon: mdi:thermometer

    - name: Schlerver CPU Temp High
      value_template: "{{ float(value_json.cpus.high,default=0) }}"
      #device_class: temperature ### Converts to F!
      unit_of_measurement: '°C'
      icon: mdi:thermometer

    - name: Schlerver CPU Temp Critical
      value_template: "{{ float(value_json.cpus.critical,default=0) }}"
      #device_class: temperature ### Converts to F!
      unit_of_measurement: '°C'
      icon: mdi:thermometer

    - name: Schlerver CPU Load Avg 15min
      value_template: "{{ float(value_json.cpus.load_average_15min,default=0) | round(2) }}"


#####################
# Memory
#####################
    - name: Schlerver Memory total
      value_template: "{{ float(value_json.memory.total,default=0) }}"

    - name: Schlerver Memory PCT Used
      value_template: "{{ float(value_json.memory.pct_used,default=0) }}"


#####################
# Swap
#####################
    - name: Schlerver Swap total
      value_template: "{{ float(value_json.swap.total,default=0) }}"

    - name: Schlerver Swap Used
      value_template: "{{ float(value_json.swap.used,default=0) }}"

    - name: Schlerver Swap PCT Used
      value_template: "{{ float(value_json.swap.pct_used,default=0) }}"


#####################
# GPUs
#####################
    - name: Schlerver GPU 0 UUID
      value_template: "{{ value_json['gpus']['0']['uuid'] }}"
      icon: si:nvidia

    - name: Schlerver GPU 0 Name
      value_template: "{{ value_json['gpus']['0']['name'] }}"
      icon: si:nvidia

    - name: Schlerver GPU 0 Utilization
      value_template: "{{ int(value_json['gpus']['0']['utilization'],default=0) }}"
      icon: si:nvidia

    - name: Schlerver GPU 0 Memory total
      value_template: "{{ float(value_json['gpus']['0']['memory_total'],default=0) }}"
      icon: si:nvidia

    - name: Schlerver GPU 0 PCT Used
      value_template: "{{ float(value_json['gpus']['0']['pct_used'],default=0) }}"
      icon: si:nvidia

    - name: Schlerver GPU 0 Temperature
      value_template: "{{ float(value_json['gpus']['0']['temperature'],default=0) }}"
      #device_class: temperature ### Converts to F!
      unit_of_measurement: '°C'
      icon: mdi:thermometer


